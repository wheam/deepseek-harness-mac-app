name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Shown on every release. The app carries a self-signed signature (no paid
  # Apple Developer ID), so a *browser* download triggers Gatekeeper on first
  # launch; the one-line installer avoids the quarantine attribute entirely.
  # Keep these notes in sync with the README's download guide.
  RELEASE_NOTES: |
    **One-line install (no Gatekeeper warning):**

    ```sh
    curl -fsSL https://github.com/wheam/deepseek-harness-mac-app/releases/download/latest/install.sh | sh
    ```

    The installer downloads `DeepSeek-Harness.zip`, verifies the code signature, installs into `/Applications` (or `~/Applications` if that isn't writable) and opens the app. Because it is not a browser download, the app carries no quarantine attribute — no warning, no extra steps.

    **Manual download:** this build is signed with a self-signed identity (no Apple Developer ID), so a browser download triggers Gatekeeper on first launch. To allow it:

    - macOS 15+ (Sequoia/Tahoe): after the blocked first attempt, open **System Settings → Privacy & Security → Security** and click **"Open Anyway"** (the right-click → Open override was removed in macOS 15), **or**
    - macOS 13/14: right-click (Ctrl-click) the app in Finder → **Open**, then confirm, **or**
    - run: `xattr -cr "/Applications/DeepSeek Harness.app"`

    Removing the warning for browser downloads entirely requires an Apple Developer ID certificate + notarization (paid Apple Developer Program). See the README for details.

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up signing identity
        env:
          P12_BASE64: ${{ secrets.GH_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GH_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "$P12_BASE64" | base64 -d > /tmp/dsh-dev.p12
            security create-keychain -p "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security set-keychain-settings -lut 21600 /tmp/dsh-signing.keychain-db
            security unlock-keychain -p "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security import /tmp/dsh-dev.p12 -P "$P12_PASSWORD" -k /tmp/dsh-signing.keychain-db -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security list-keychains -d user -s /tmp/dsh-signing.keychain-db
            rm -f /tmp/dsh-dev.p12
            # The certificate must carry the Code Signing EKU
            # (1.3.6.1.5.5.7.3.3); it is enforced on the shipped bundle in
            # the "Verify code signature" step (build.sh also falls back to
            # ad-hoc when it is missing).
            echo "CODESIGN_IDENTITY=DeepSeek Harness Dev" >> "$GITHUB_ENV"
            echo "CODESIGN_KEYCHAIN=/tmp/dsh-signing.keychain-db" >> "$GITHUB_ENV"
            echo "CODESIGN_KEYCHAIN_PASSWORD=$P12_PASSWORD" >> "$GITHUB_ENV"
            echo "signing identity ready"
          else
            echo "no signing secrets; build.sh falls back to ad-hoc"
          fi

      - name: Build universal app bundle
        run: UNIVERSAL=1 ./build.sh

      - name: Verify code signature
        run: |
          bash -n install.sh
          codesign --verify --deep --strict --verbose=2 "dist/DeepSeek Harness.app"
          codesign -dv --verbose=2 "dist/DeepSeek Harness.app"
          # Gatekeeper rejects both self-signed and ad-hoc signatures; log
          # the assessment for transparency (the warning is expected, see
          # the README's download guide for the first-launch steps).
          spctl -a -vv --type execute "dist/DeepSeek Harness.app" || true
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            # The fixed identity was requested, so the shipped bundle must
            # embed a certificate with the Code Signing EKU
            # (1.3.6.1.5.5.7.3.3); without it a downloaded copy can be
            # reported as "damaged" instead of "unidentified developer".
            # Fail the build rather than ship a bad certificate.
            mkdir -p /tmp/dsh-certs && cd /tmp/dsh-certs
            codesign -d --extract-certificates "$GITHUB_WORKSPACE/dist/DeepSeek Harness.app"
            openssl x509 -inform DER -in codesign0 -noout -text | grep -Eqi "code signing" \
              || { echo "::error::shipped bundle lacks a certificate with the Code Signing EKU; regenerate the p12 with scripts/signing.cnf (see scripts/setup-signing.sh)"; exit 1; }
          fi

      - name: Package zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Harness.app" DeepSeek-Harness.zip
          cd ..
          mv "dist/DeepSeek-Harness.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness
          path: DeepSeek-Harness.zip
          if-no-files-found: error

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" DeepSeek-Harness.zip install.sh --notes "$RELEASE_NOTES"

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DeepSeek-Harness.zip install.sh \
            --title "Latest build" \
            --notes "$RELEASE_NOTES" \
            --prerelease
