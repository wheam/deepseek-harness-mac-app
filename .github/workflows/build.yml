name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up signing identity
        env:
          P12_BASE64: ${{ secrets.GH_CODESIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GH_CODESIGN_P12_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "$P12_BASE64" | base64 -d > /tmp/dsh-dev.p12
            security create-keychain -p "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security set-keychain-settings -lut 21600 /tmp/dsh-signing.keychain-db
            security unlock-keychain -p "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security import /tmp/dsh-dev.p12 -P "$P12_PASSWORD" -k /tmp/dsh-signing.keychain-db -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" /tmp/dsh-signing.keychain-db
            security list-keychains -d user -s /tmp/dsh-signing.keychain-db
            rm -f /tmp/dsh-dev.p12
            echo "signing identity ready"
          else
            echo "no signing secrets; builds fall back to ad-hoc"
          fi

      - name: Build universal app bundle
        env:
          CODESIGN_IDENTITY: "DeepSeek Harness Dev"
          CODESIGN_KEYCHAIN: /tmp/dsh-signing.keychain-db
          CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.GH_CODESIGN_P12_PASSWORD }}
        run: UNIVERSAL=1 ./build.sh

      - name: Package zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "DeepSeek Harness.app" DeepSeek-Harness.zip
          cd ..
          mv "dist/DeepSeek-Harness.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness
          path: DeepSeek-Harness.zip
          if-no-files-found: error

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" DeepSeek-Harness.zip --generate-notes

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DeepSeek-Harness.zip \
            --title "Latest build" \
            --notes "Automatically built from the default branch. Universal (Apple Silicon + Intel), ad-hoc signed. First launch: right-click the app and choose Open, or run: xattr -dr com.apple.quarantine \"/Applications/DeepSeek Harness.app\"" \
            --prerelease
